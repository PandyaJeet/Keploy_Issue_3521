services:
  app:
    build: .
    container_name: keploy-cpp-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: keploy_db
      DB_USER: postgres
      DB_PASS: postgres
    networks:
      - keploy-net

  db:
    image: postgres:15
    container_name: keploy-cpp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: keploy_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keploy_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - keploy-net

volumes:
  pgdata:

networks:
  keploy-net:
    external: false
